name: Android ARM64 build and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.inc'
      - '**/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'build_arm64.py'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: raftpirates-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: RaftPirates
      - uses: actions/checkout@v4
        with:
          repository: mlnitoon2/HydraLegacy
          ref: main
          path: HydraLegacy
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install native build tools
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build and verify native library
        working-directory: RaftPirates
        run: python3 build_arm64.py --sdk "$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: raftpirates-arm64
          path: RaftPirates/out/lib/arm64-v8a/libraftpirates.so
          if-no-files-found: error
      - name: Publish verified library to main
        working-directory: RaftPirates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "Main changed during the build; refusing to publish a stale binary."
            exit 1
          fi
          cp out/lib/arm64-v8a/libraftpirates.so libraftpirates.so
          git add --force libraftpirates.so
          if git diff --cached --quiet; then
            echo "Native library is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build: publish ARM64 libraftpirates.so' \
            -m "RaftPirates: $GITHUB_SHA" \
            -m "HydraLegacy: $(git -C ../HydraLegacy rev-parse HEAD)"
          git push origin HEAD:main
