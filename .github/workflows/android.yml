name: Android ARM64 build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.inc'
      - '**/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'build_arm64.py'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: RaftPirates
      - uses: actions/checkout@v4
        with:
          repository: mlnitoon2/HydraLegacy
          ref: e8da279d566ffdd8bca23e0e0740e1bd81a335e8
          path: HydraLegacy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install command-line build dependencies
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build and check native library
        working-directory: RaftPirates
        run: python3 build_arm64.py --sdk "$ANDROID_HOME" --minimal
      - uses: actions/upload-artifact@v4
        with:
          name: raftpirates-arm64
          path: RaftPirates/out/lib/arm64-v8a/libraftpirates.so
          if-no-files-found: error
