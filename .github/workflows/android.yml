name: Android ARM64 build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.inc'
      - '**/CMakeLists.txt'
      - 'build_arm64.py'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: RaftPirates
      - uses: actions/checkout@v4
        with:
          repository: mlnitoon2/HydraLegacy
          ref: 11a2810b089828a597e8f068c10a3b52c6c3ddea
          path: HydraLegacy
      - name: Install command-line build dependencies
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build and check native library
        working-directory: RaftPirates
        run: python3 build_arm64.py --sdk "$ANDROID_HOME" --minimal
      - uses: actions/upload-artifact@v4
        with:
          name: raftpirates-arm64
          path: RaftPirates/out/lib/arm64-v8a/libraftpirates.so
          if-no-files-found: error
