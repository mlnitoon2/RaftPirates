name: Windows desktop build
on:
  push:
    branches: [main]
    paths-ignore:
      - libraftpirates.so
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-autobuild-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: RaftPirates
      - uses: actions/checkout@v4
        with:
          repository: mlnitoon2/HydraLegacy
          token: ${{ secrets.HYDRA_REPO_TOKEN || github.token }}
          path: HydraLegacy
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_mixer
            mingw-w64-ucrt-x86_64-asio
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-ca-certificates
      - name: Identify compiler cache
        id: compiler
        shell: msys2 {0}
        run: |
          echo "toolchain=$(pacman -Q | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: windows-ucrt-ccache-v1-${{ steps.compiler.outputs.toolchain }}-${{ github.sha }}
          restore-keys: |
            windows-ucrt-ccache-v1-${{ steps.compiler.outputs.toolchain }}-
      - name: Configure and build
        shell: msys2 {0}
        run: |
          export CCACHE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/.ccache"
          export CCACHE_BASEDIR="$(cygpath -u "$GITHUB_WORKSPACE")"
          ccache --max-size=750M
          ccache --zero-stats
          cmake -S RaftPirates -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRAFT_DESKTOP=ON -DHYDRA_FETCH_LUA=ON -DBUILD_TESTING=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target raftpirates_desktop sfs_native_tests --parallel 4
          ccache --show-stats
          ctest --test-dir build -R '^sfs_native_session$' --output-on-failure
      - name: Authenticode signing (optional authorized certificate)
        id: sign
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SIGNING_PFX) {
            if ($env:SIGNING_PASSWORD) { throw 'Signing PFX missing' }
            'status=unsigned' >> $env:GITHUB_OUTPUT
            Write-Warning 'No trusted code-signing certificate configured. Artifact will be labeled unsigned.'
            exit 0
          }
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'Windows SDK SignTool not found' }
          $pfx = Join-Path $env:RUNNER_TEMP 'raftpirates-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
            & $tool.FullName sign /fd SHA256 /f $pfx /p $env:SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 build/raftpirates_desktop.exe
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
            & $tool.FullName verify /pa /v build/raftpirates_desktop.exe
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed' }
            if ((Get-AuthenticodeSignature build/raftpirates_desktop.exe).Status -ne 'Valid') { throw 'Untrusted signature' }
            'status=signed' >> $env:GITHUB_OUTPUT
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Package portable Windows ZIP
        shell: msys2 {0}
        env:
          SIGNING_STATUS: ${{ steps.sign.outputs.status }}
        run: |
          mkdir -p dist
          python RaftPirates/tools/package_windows.py --exe build/raftpirates_desktop.exe \
            --prefix "$(cygpath -m /ucrt64)" \
            --output "dist/WindowsRaftPirates.zip" \
            --status "$SIGNING_STATUS" --revision "$(git -C RaftPirates rev-parse HEAD)" \
            --hydra-revision "$(git -C HydraLegacy rev-parse HEAD)"
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WindowsRaftPirates
          path: dist/WindowsRaftPirates.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: windows
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WindowsRaftPirates
          path: dist
      - name: Publish latest Windows autobuild
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Android's generated-library commit changes main without changing
          # Windows source. Publish every successful Windows build, not only
          # builds that happen to finish before the next source commit.
          # Workflow concurrency prevents overlapping publication.
          if gh release view windows-autobuild >/dev/null 2>&1; then
            previous="$(gh release view windows-autobuild --json body --jq .body | sed -n 's/^Windows workflow run: \([0-9][0-9]*\)$/\1/p' | head -n 1)"
            if [[ -n "$previous" && "$previous" -gt "$GITHUB_RUN_NUMBER" ]]; then
              echo "::notice::A newer successful Windows build is already published."
              exit 0
            fi
          fi
          test -s dist/WindowsRaftPirates.zip
          unzip -tq dist/WindowsRaftPirates.zip
          notes="Automated Windows x64 build from $GITHUB_SHA. Extract the ZIP before running raftpirates_desktop.exe. See BUILD.txt for exact source revisions, signing status and asset completeness. A compatible server and any missing original assets are required."
          notes="$(printf '%s\n\nWindows workflow run: %s\n' "$notes" "$GITHUB_RUN_NUMBER")"
          if ! gh release view windows-autobuild >/dev/null 2>&1; then
            gh release create windows-autobuild --target "$GITHUB_SHA" --title "Windows autobuild" --notes "$notes" --prerelease --latest=false
          fi
          gh release upload windows-autobuild dist/WindowsRaftPirates.zip --clobber
          gh release edit windows-autobuild --title "Windows autobuild" --notes "$notes" --prerelease --latest=false
          echo "[Download WindowsRaftPirates.zip](https://github.com/$GH_REPO/releases/download/windows-autobuild/WindowsRaftPirates.zip)" >> "$GITHUB_STEP_SUMMARY"
