name: Source formatting
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install formatter
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Format source
        run: python3 tools/format.py --clang-format clang-format-18
      - name: Commit formatting
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m "Apply consistent clang-format source style"
          git push origin HEAD:main
