name: Host regression tests
on:
  push:
    branches: [main]
    paths-ignore:
      - libraftpirates.so
      - '**/*.md'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: RaftPirates
      - uses: actions/checkout@v4
        with:
          repository: mlnitoon2/HydraLegacy
          path: HydraLegacy
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build zlib1g-dev libexpat1-dev libpng-dev liblua5.1-0-dev libfreetype-dev
      - name: Configure
        run: cmake -S RaftPirates -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
