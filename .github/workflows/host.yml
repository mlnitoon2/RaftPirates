name: Host regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: RaftPirates
      - uses: actions/checkout@v4
        with:
          repository: mlnitoon2/HydraLegacy
          token: ${{ secrets.HYDRA_REPO_TOKEN || github.token }}
          path: HydraLegacy
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build zlib1g-dev libexpat1-dev libpng-dev liblua5.1-0-dev libfreetype-dev libsdl2-dev libsdl2-mixer-dev libasio-dev libssl-dev libcurl4-openssl-dev nlohmann-json3-dev
      - name: Configure
        run: |
          extra=()
          if [ -d RaftPirates/assets/menus ] && [ -f RaftPirates/assets/xml_resources/properties.xml ]; then
            extra+=("-DRAFT_ASSET_ROOT=$GITHUB_WORKSPACE/RaftPirates/assets")
          fi
          cmake -S RaftPirates -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DRAFT_DESKTOP=ON "${extra[@]}"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        id: host_tests
        run: ctest --test-dir build --output-on-failure

      - name: Generate revision verification dashboard
        if: always()
        run: |
          if [ -f build/libraftpirates_game.a ]; then
            python3 RaftPirates/tools/progress_page.py --archive build/libraftpirates_game.a --historical RaftPirates/docs/MATCHING_STATUS.md --namespace rp --output progress-site --tests "${{ steps.host_tests.outcome }}"
          fi
      - name: Upload verification dashboard
        if: always() && hashFiles('progress-site/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: verification-dashboard
          path: progress-site
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: progress-site
  pages:
    needs: host
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    concurrency:
      group: verification-pages
      cancel-in-progress: true
    steps:
      - name: Deploy verification dashboard
        id: deployment
        uses: actions/deploy-pages@v4
